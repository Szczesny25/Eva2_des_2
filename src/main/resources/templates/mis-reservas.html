<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis reservas · Sabor Gourmet</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="site-header"><nav class="container nav"><a class="brand" th:href="@{/}">Sabor <span>Gourmet</span></a><div><a th:href="@{/disponibilidad}">Disponibilidad</a><a th:href="@{/mis-reservas}">Mis reservas</a><a th:href="@{/admin}">Administración</a></div></nav></header>
<main class="container page"><span class="eyebrow">TU VISITA</span><h1>Mis reservas</h1><p class="lead">Ingresa el correo que usaste al reservar.</p><div class="alert success" th:if="${exito}" th:text="${exito}"></div><form class="search-form card" th:action="@{/mis-reservas}" method="get"><label>Correo electrónico<input type="email" name="email" required th:value="${email}"></label><button type="submit" class="button">Buscar reservas</button></form>
<p th:if="${reservas != null and #lists.isEmpty(reservas)}">No se encontraron reservas con ese correo.</p><div class="cards" th:if="${reservas != null}"><article class="card reserva-card" th:each="r : ${reservas}"><div class="row-between"><span class="badge" th:classappend="${r.estado.name() == 'CANCELADA'} ? ' muted' : ''" th:text="${r.estado}">Estado</span><small th:text="'#' + ${r.id}">#1</small></div><h2 th:text="${#temporals.format(r.inicio, 'dd/MM/yyyy · HH:mm')}">Fecha</h2><p th:text="'Mesa ' + ${r.mesa.numero} + ' · ' + ${r.personas} + ' personas'">Mesa</p><p th:text="${r.cliente.nombre}">Cliente</p><div class="card-actions" th:if="${r.estado.name() == 'ACTIVA'}"><a class="button outline" th:href="@{/reservas/{id}/editar(id=${r.id})}">Modificar</a><form th:action="@{/reservas/{id}/cancelar(id=${r.id})}" method="post" onsubmit="return confirm('¿Cancelar esta reserva?')"><input type="hidden" name="email" th:value="${email}"><button type="submit" class="text-button">Cancelar</button></form></div></article></div></main><footer class="container footer">Sabor Gourmet · Sistema de reservas</footer></body></html>
