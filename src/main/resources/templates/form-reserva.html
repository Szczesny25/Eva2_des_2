<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${titulo} + ' · Sabor Gourmet'">Reserva</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="site-header"><nav class="container nav"><a class="brand" th:href="@{/}">Sabor <span>Gourmet</span></a><div><a th:href="@{/disponibilidad}">Disponibilidad</a><a th:href="@{/mis-reservas}">Mis reservas</a><a th:href="@{/admin}">Administración</a></div></nav></header>
<main class="container page narrow"><span class="eyebrow">CONFIRMA TU VISITA</span><h1 th:text="${titulo}">Reserva</h1><p class="lead">Completa tus datos. La mesa se verificará de nuevo al guardar.</p><div class="alert error" th:if="${error}" th:text="${error}"></div>
<form class="card form-grid" th:action="@{${accion}}" th:object="${reservaForm}" method="post"><label>Nombre completo<input th:field="*{nombre}" maxlength="120" required><small class="field-error" th:errors="*{nombre}"></small></label><label>Correo electrónico<input th:field="*{email}" type="email" maxlength="180" required><small class="field-error" th:errors="*{email}"></small></label><label>Teléfono<input th:field="*{telefono}" type="tel" maxlength="40" required><small class="field-error" th:errors="*{telefono}"></small></label><label>Personas<input th:field="*{personas}" type="number" min="1" max="20" required><small class="field-error" th:errors="*{personas}"></small></label><label>Fecha y hora<input th:field="*{inicio}" type="datetime-local" required><small class="field-error" th:errors="*{inicio}"></small></label><label>Mesa<select th:field="*{mesaId}" required><option value="">Selecciona una mesa</option><option th:each="mesa : ${mesas}" th:value="${mesa.id}" th:text="'Mesa ' + ${mesa.numero} + ' · ' + ${mesa.capacidad} + ' personas'"></option></select><small class="field-error" th:errors="*{mesaId}"></small></label><div class="form-actions"><button class="button" type="submit">Guardar reserva</button><a th:href="@{/disponibilidad}">Volver a buscar</a></div></form></main><footer class="container footer">Sabor Gourmet · Sistema de reservas</footer></body></html>
