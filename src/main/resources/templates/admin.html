<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administración · Sabor Gourmet</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="site-header"><nav class="container nav"><a class="brand" th:href="@{/}">Sabor <span>Gourmet</span></a><div><a th:href="@{/disponibilidad}">Disponibilidad</a><a th:href="@{/mis-reservas}">Mis reservas</a><a th:href="@{/admin}">Administración</a></div></nav></header>
<main class="container page"><span class="eyebrow">PANEL DEL RESTAURANTE</span><h1>Administración</h1><div class="alert success" th:if="${exito}" th:text="${exito}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section><h2>Mesas</h2><div class="admin-grid"><form class="card form-grid" th:action="@{/admin/mesas}" method="post" th:object="${mesaForm}"><h3>Agregar mesa</h3><label>Número<input type="number" th:field="*{numero}" min="1" required></label><label>Capacidad<input type="number" th:field="*{capacidad}" min="1" max="20" required></label><label class="checkbox"><input type="checkbox" th:field="*{activa}"> Activa</label><button class="button" type="submit">Agregar</button></form><div class="card table-wrap"><table><thead><tr><th>Mesa</th><th>Capacidad</th><th>Activa</th><th>Guardar</th></tr></thead><tbody><tr th:each="m : ${mesas}"><td th:text="${m.numero}"></td><td colspan="3"><form class="inline-form" th:action="@{/admin/mesas/{id}(id=${m.id})}" method="post"><input name="capacidad" type="number" min="1" max="20" required th:value="${m.capacidad}" aria-label="Capacidad"><label class="checkbox"><input name="activa" type="checkbox" value="true" th:checked="${m.activa}"> Sí</label><button class="button small" type="submit">Guardar</button></form></td></tr></tbody></table></div></div></section>
<section><h2>Reservas actuales</h2><div class="card table-wrap"><table><thead><tr><th>ID</th><th>Fecha y hora</th><th>Cliente</th><th>Contacto</th><th>Mesa</th><th>Personas</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="r : ${reservas}"><td th:text="${r.id}"></td><td th:text="${#temporals.format(r.inicio, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.cliente.nombre}"></td><td th:text="${r.cliente.email}"></td><td th:text="${r.mesa.numero}"></td><td th:text="${r.personas}"></td><td th:text="${r.estado}"></td><td><a th:if="${r.estado.name() == 'ACTIVA'}" th:href="@{/reservas/{id}/editar(id=${r.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(reservas)}"><td colspan="8">Aún no hay reservas.</td></tr></tbody></table></div></section></main><footer class="container footer">Sabor Gourmet · Sistema de reservas</footer></body></html>
